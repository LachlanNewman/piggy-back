databases:
  - name: piggy-back-db
    databaseName: piggyback
    user: piggyback
    plan: free
    region: oregon

services:
  - type: web
    name: piggy-back
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: piggy-back-db
          property: connectionString
      # Auth0 tenant URL and the API identifier tokens must be minted for.
      # OIDC_AUDIENCE must match the frontend's VITE_OIDC_AUDIENCE, or every
      # request 401s. Discovery runs at startup, so a wrong issuer fails the
      # deploy rather than every request.
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      # Set to "debug" in the Dashboard to log each token's aud/iss against what
      # this service expects. Defaults to info when unset.
      - key: LOG_LEVEL
        sync: false
      # Upper bound on the nearby search radius, in km. NEARBY_RADIUS_KM is
      # clamped to this, so it bounds how expensive one search can get.
      # Defaults to 20 when unset.
      - key: MAX_NEARBY_RADIUS_KM
        sync: false

  - type: web
    runtime: static
    name: piggy-back-frontend
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      # SPA catch-all so /callback and other client-side routes resolve.
      # Must stay last if more specific rules are added above it.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # VITE_* vars are inlined at build time, so changing any of these
      # requires a rebuild, not just a restart.
      - key: VITE_API_BASE_URL
        value: https://piggy-back-qwo5.onrender.com
      # Set in the Dashboard once an OIDC provider is reachable — the Keycloak
      # in docker-compose.yml is local-only and its realm allows just
      # http://localhost:5173. VITE_OIDC_REDIRECT_URI must be this site's own
      # URL + /callback, which isn't known until the service is created.
      - key: VITE_OIDC_AUTHORITY
        sync: false
      - key: VITE_OIDC_CLIENT_ID
        sync: false
      - key: VITE_OIDC_REDIRECT_URI
        sync: false
      - key: VITE_OIDC_AUDIENCE
        sync: false
